name: Terraform Apply

on:
  push:
    branches: [master]
    paths:
      - "aws-infra-tf/**"
      - ".github/workflows/apply.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  # Computes the plan once. The apply job below applies exactly this
  # artifact, so what gets approved is what gets applied - not a second,
  # possibly different plan computed after approval.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-infra-tf
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY - remove once the OIDC trust issue is diagnosed. Prints
      # only the token's claims (repo, ref, event, etc.), never the signed
      # token itself.
      - name: Debug OIDC token claims
        run: |
          python3 << 'EOF'
          import json, base64, urllib.request, os

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          req = urllib.request.Request(url, headers={"Authorization": f"bearer {req_token}"})
          id_token = json.load(urllib.request.urlopen(req))["value"]

          payload = id_token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keep = ["sub", "aud", "repository", "repository_owner", "ref", "event_name", "actor"]
          print(json.dumps({k: claims.get(k) for k in keep}, indent=2))
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598451516076:role/serverless-data-lake-pipeline-ci-role
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -var-file="variables/dev-modular.tfvars" -no-color -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: aws-infra-tf/tfplan
          retention-days: 1

  # Gated by the "production" GitHub Environment - pauses here until a
  # reviewer approves in the Actions UI.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    defaults:
      run:
        working-directory: aws-infra-tf
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598451516076:role/serverless-data-lake-pipeline-ci-role
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: terraform init
        run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: aws-infra-tf

      - name: terraform apply
        run: terraform apply -auto-approve tfplan
