<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSV Upload</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b92a3;
    --accent: #6c8cff;
    --ok: #3fbf7f;
    --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 420px;
    max-width: 90vw;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #0d1017;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
  }
  input[type="file"] {
    width: 100%;
    font-size: 13px;
    color: var(--muted);
  }
  .filename {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .status.ok {
    display: block;
    background: rgba(63, 191, 127, 0.12);
    color: var(--ok);
    border: 1px solid rgba(63, 191, 127, 0.3);
  }
  .status.err {
    display: block;
    background: rgba(224, 90, 90, 0.12);
    color: var(--err);
    border: 1px solid rgba(224, 90, 90, 0.3);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Upload CSV</h1>
    <p class="sub">Converts to Parquet and catalogs it automatically.</p>

    <label for="apiUrl">API Gateway URL</label>
    <input type="text" id="apiUrl" placeholder="https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com/v1/upload" />

    <label for="file">CSV file</label>
    <input type="file" id="file" accept=".csv" />
    <div class="filename" id="filename"></div>

    <button id="uploadBtn" disabled>Upload</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const apiUrlInput = document.getElementById("apiUrl");
    const fileInput = document.getElementById("file");
    const filenameEl = document.getElementById("filename");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");

    // Remember the last-used API URL across visits, since it changes on
    // every fresh terraform apply.
    apiUrlInput.value = localStorage.getItem("uploadApiUrl") || "";
    apiUrlInput.addEventListener("input", () => {
      localStorage.setItem("uploadApiUrl", apiUrlInput.value.trim());
    });

    let selectedFile = null;

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files[0] || null;
      filenameEl.textContent = selectedFile ? selectedFile.name : "";
      uploadBtn.disabled = !selectedFile || !apiUrlInput.value.trim();
    });

    apiUrlInput.addEventListener("input", () => {
      uploadBtn.disabled = !selectedFile || !apiUrlInput.value.trim();
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      const base = apiUrlInput.value.trim().replace(/\/$/, "");
      const url = `${base}?filename=${encodeURIComponent(selectedFile.name)}`;

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";
      statusEl.className = "status";

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: selectedFile,
        });

        const text = await res.text();

        if (res.ok) {
          statusEl.className = "status ok";
          statusEl.textContent = `Uploaded as "${selectedFile.name}" - ${text}`;
        } else {
          statusEl.className = "status err";
          statusEl.textContent = `Failed (${res.status}): ${text}`;
        }
      } catch (err) {
        statusEl.className = "status err";
        statusEl.textContent = `Request failed: ${err.message}`;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload";
      }
    });
  </script>
</body>
</html>
